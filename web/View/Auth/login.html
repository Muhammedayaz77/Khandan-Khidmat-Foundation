<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Khandan Khidmat Foundation</title><link rel="stylesheet" href="/assets/css/styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="/"><b>Khandan Khidmat Foundation</b><small>Member Portal</small></a><a href="/">Home</a></div></header><main class="login-wrap"><section class="login"><span class="eyebrow">Secure Login</span><h1 style="font-size:42px">Welcome back</h1><p class="muted">Members and managers use the same login. Your role decides what you can access.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required minlength="6" autocomplete="current-password"></div><button class="btn" type="submit">Login</button><div id="error" class="error"></div></form></section></main><script src="/assets/js/app.js"></script><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('error');error.textContent='';try{const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});localStorage.setItem('kkf_token',r.access_token);localStorage.setItem('kkf_user',JSON.stringify(r.user));location.href=r.user.role==='manager'?'/manager/dashboard.html':'/member/dashboard.html'}catch(x){error.textContent=x.message}})</script></body></html>
