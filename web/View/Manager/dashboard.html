<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manager Dashboard</title><link rel="stylesheet" href="/assets/css/styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="/"><b>Khandan Khidmat Foundation</b><small>Manager Portal</small></a><button class="btn" onclick="logout()">Logout</button></div></header><main class="dashboard"><div class="container"><div class="topbar"><div><span class="eyebrow">Manager Dashboard</span><h2 id="welcome">Foundation Management</h2><p class="muted">Manage members, income, expenses and controlled website content.</p></div></div><div class="stats"><div class="stat"><span class="muted">Total Collection</span><strong id="income">₹0</strong></div><div class="stat"><span class="muted">Total Expense</span><strong id="expense">₹0</strong></div><div class="stat"><span class="muted">Current Balance</span><strong id="balance">₹0</strong></div></div><section class="card" style="margin-top:25px"><h3>Add Member</h3><form id="memberForm" class="grid"><div class="field"><label>Name</label><input id="mName" required></div><div class="field"><label>Email</label><input id="mEmail" type="email" required></div><div class="field"><label>Temporary Password</label><input id="mPassword" type="password" minlength="6" required></div><div class="field"><label>Phone</label><input id="mPhone"></div><div class="field"><label>Monthly Contribution</label><input id="mContribution" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Address</label><input id="mAddress"></div><div><button class="btn" type="submit">Create Member</button></div></form><div id="memberMsg" class="notice"></div></section><section class="card" style="margin-top:25px"><h3>Add Finance Entry</h3><form id="financeForm" class="grid"><div class="field"><label>Type</label><select id="fType"><option value="income">Collection / Income</option><option value="expense">Expense</option></select></div><div class="field"><label>Amount</label><input id="fAmount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Title</label><input id="fTitle" required></div><div class="field"><label>Description</label><input id="fDescription"></div><div><button class="btn" type="submit">Save Entry</button></div></form><div id="financeMsg" class="notice"></div></section><section><h2>Members</h2><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Monthly</th><th>Status</th></tr></thead><tbody id="members"></tbody></table></div></section></div></main><script src="/assets/js/app.js"></script><script>(async()=>{const u=await requireLogin();if(!u)return;if(u.role!=='manager'){location.href='/member/dashboard.html';return}welcome.textContent=`Welcome, ${u.name}`;await refresh();memberForm.addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/members',{method:'POST',body:JSON.stringify({name:mName.value,email:mEmail.value,password:mPassword.value,phone:mPhone.value,address:mAddress.value,monthly_contribution:Number(mContribution.value||0)})});memberMsg.textContent='Member created successfully.';e.target.reset();await refresh()}catch(x){memberMsg.textContent=x.message}});financeForm.addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/finance/transactions',{method:'POST',body:JSON.stringify({transaction_type:fType.value,amount:Number(fAmount.value),title:fTitle.value,description:fDescription.value})});financeMsg.textContent='Finance entry saved.';e.target.reset();await refresh()}catch(x){financeMsg.textContent=x.message}})})();async function refresh(){const [s,m]=await Promise.all([api('/api/finance/summary'),api('/api/members')]);income.textContent=money(s.total_income);expense.textContent=money(s.total_expense);balance.textContent=money(s.balance);members.innerHTML=m.map(x=>`<tr><td>${x.name}</td><td>${x.email}</td><td>${x.phone||'-'}</td><td>${money(x.monthly_contribution)}</td><td>${x.is_active?'Active':'Inactive'}</td></tr>`).join('')}</script></body></html>
