<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Dashboard</title><link rel="stylesheet" href="/assets/css/styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="/"><b>Khandan Khidmat Foundation</b><small>Member Portal</small></a><button class="btn" onclick="logout()">Logout</button></div></header><main class="dashboard"><div class="container"><div class="topbar"><div><span class="eyebrow">Member Dashboard</span><h2 id="welcome">Account</h2><p class="muted">Financial information available to authenticated members.</p></div></div><div class="stats"><div class="stat"><span class="muted">Total Collection</span><strong id="income">₹0</strong></div><div class="stat"><span class="muted">Total Expense</span><strong id="expense">₹0</strong></div><div class="stat"><span class="muted">Current Balance</span><strong id="balance">₹0</strong></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Title</th><th>Amount</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script src="/assets/js/app.js"></script><script>(async()=>{const u=await requireLogin();if(!u)return;if(u.role!=='member'){location.href='/manager/dashboard.html';return}welcome.textContent=`Welcome, ${u.name}`;const [s,rows]=await Promise.all([api('/api/finance/summary'),api('/api/finance/transactions')]);income.textContent=money(s.total_income);expense.textContent=money(s.total_expense);balance.textContent=money(s.balance);document.getElementById('rows').innerHTML=rows.map(r=>`<tr><td>${new Date(r.created_at).toLocaleDateString('en-IN')}</td><td>${r.type}</td><td>${r.title}</td><td>${money(r.amount)}</td></tr>`).join('')})()</script></body></html>
