<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manager Dashboard</title><link rel="stylesheet" href="static-test/styles.css"></head><body><header class="top"><div class="container bar"><a class="brand" href="index.html"><span class="logo">♥</span>Khandan Khidmat Foundation</a><div><button class="theme" onclick="toggleTheme()">☀ / ☾</button><button onclick="logout()">Logout</button></div></div></header><main class="container dashboard"><span class="eyebrow">Manager Dashboard</span><h1 id="welcome">Manager</h1><div class="grid"><section class="panel"><h2>Members</h2><p>Demo member accounts available for testing.</p><ul id="members"></ul></section><section class="panel"><h2>Finance</h2><p>Static JSON data is used in this GitHub Pages test. Later the manager UI can edit collection and expenses.</p><div class="stats"><div class="stat"><span>Collection</span><strong id="collection">₹0</strong></div><div class="stat"><span>Expenses</span><strong id="expense">₹0</strong></div></div></section></div></main><script src="static-test/app.js"></script><script>const u=currentUser();if(!u||u.role!=='manager')location.href='demo-login.html';document.querySelector('#welcome').textContent='Welcome, '+u.name;Promise.all([fetch('data/users.json').then(r=>r.json()),fetch('data/finance.json').then(r=>r.json())]).then(([users,finance])=>{document.querySelector('#members').innerHTML=users.members.map(x=>'<li>'+x.name+'</li>').join('');document.querySelector('#collection').textContent='₹'+finance.summary.totalCollection.toLocaleString('en-IN');document.querySelector('#expense').textContent='₹'+finance.summary.totalExpense.toLocaleString('en-IN')});</script></body></html>
