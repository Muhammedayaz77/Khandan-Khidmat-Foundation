<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Dashboard</title><link rel="stylesheet" href="static-test/styles.css"></head><body><header class="top"><div class="container bar"><a class="brand" href="index.html"><span class="logo">♥</span>Khandan Khidmat Foundation</a><div><button class="theme" onclick="toggleTheme()">☀ / ☾</button><button onclick="logout()">Logout</button></div></div></header><main class="container dashboard"><span class="eyebrow">Member Dashboard</span><h1 id="welcome">Welcome</h1><div class="stats"><div class="card"><span>Collection</span><strong id="collection">₹0</strong></div><div class="card"><span>Expenses</span><strong id="expense">₹0</strong></div><div class="card"><span>Balance</span><strong id="balance">₹0</strong></div></div><section class="panel"><h2>Recent Expenses</h2><table class="table"><thead><tr><th>Date</th><th>Purpose</th><th>Amount</th></tr></thead><tbody id="rows"></tbody></table></section></main><script src="static-test/app.js"></script><script>const u=currentUser();if(!u||u.role!=='member')location.href='demo-login.html';document.querySelector('#welcome').textContent='Welcome, '+u.name;fetch('data/finance.json').then(r=>r.json()).then(d=>{document.querySelector('#collection').textContent=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(d.summary.totalCollection);document.querySelector('#expense').textContent=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(d.summary.totalExpense);document.querySelector('#balance').textContent=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(d.summary.totalCollection-d.summary.totalExpense);document.querySelector('#rows').innerHTML=d.expenses.map(x=>'<tr><td>'+x.date+'</td><td>'+x.title+'</td><td>₹'+x.amount.toLocaleString('en-IN')+'</td></tr>').join('')});</script></body></html>
